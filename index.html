<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101014"><title>Motimori — A little world, entirely yours</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#101014;--panel:#19191f;--panel2:#222229;--text:#f6f3f7;--muted:#a8a3af;--line:#34313b;--pink:#ff5da8;--purple:#a78bfa;--good:#76e2b4;--shadow:0 16px 50px #0004}
:root[data-theme=light]{color-scheme:light;--bg:#fff8fb;--panel:#fff;--panel2:#fff0f6;--text:#302530;--muted:#837783;--line:#f0dce7;--pink:#e94c91;--purple:#8063dc;--shadow:0 12px 40px #8e41640e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}.app{max-width:1250px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:18px;padding:14px 22px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.logo{font:700 24px 'Space Grotesk';letter-spacing:-1.2px;white-space:nowrap}.logo span{color:var(--pink)}.search{flex:1;max-width:500px;margin:auto}.field{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:none}.field:focus{border-color:var(--pink)}.btn{border:0;border-radius:13px;padding:11px 15px;font-weight:700;background:var(--panel2);color:var(--text)}.btn.primary{background:linear-gradient(120deg,var(--pink),#b16bff);color:white}.btn.ghost{background:transparent;border:1px solid var(--line)}.layout{display:grid;grid-template-columns:220px minmax(0,620px) 260px;gap:22px;padding:22px}.side{position:sticky;top:85px;height:max-content}.nav{display:flex;align-items:center;gap:12px;padding:13px 14px;margin:4px 0;border-radius:13px;color:var(--muted);cursor:pointer;font-weight:600}.nav.active,.nav:hover{background:var(--panel2);color:var(--pink)}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:16px;box-shadow:var(--shadow)}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--pink);font-weight:700}.muted{color:var(--muted)}.small{font-size:12px}.postbox{display:flex;gap:12px}.avatar{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;flex-shrink:0;background:linear-gradient(135deg,#ff7ab6,#8b7bff);font-size:22px}.postbox textarea{resize:vertical;min-height:75px}.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}.posthead{display:flex;gap:10px;align-items:center}.posthead .grow{flex:1}.postbody{white-space:pre-wrap;line-height:1.65;margin:17px 0}.postactions{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}.chip{font-size:12px;padding:7px 10px;border-radius:10px;background:var(--panel2);color:var(--muted)}.right-title{font:600 16px 'Space Grotesk';margin:0 0 12px}.feature{background:linear-gradient(145deg,#352033,#27214b);border:1px solid #714064;border-radius:18px;padding:18px;margin-bottom:16px;color:#fff}.feature p{color:#e8d8eb;font-size:13px;line-height:1.55}.empty{text-align:center;padding:45px 15px}.empty .emoji{font-size:38px}.status{font-size:12px;color:var(--muted);margin-top:8px}.auth-wrap{max-width:440px;margin:8vh auto;padding:18px}.auth-logo{font:700 38px 'Space Grotesk';text-align:center;margin-bottom:8px}.auth-logo span{color:var(--pink)}.auth-sub{text-align:center;color:var(--muted);margin-bottom:26px}.auth-card{padding:24px}.auth-card label{display:block;font-size:13px;margin:15px 0 7px}.hidden{display:none!important}.mobile-nav{display:none}.profile-cover{height:115px;border-radius:15px;background:linear-gradient(120deg,#ff79b7,#a18aff,#6c9cff);margin-bottom:-28px}.profile-info{position:relative;padding:0 6px}.profile-info .avatar{width:68px;height:68px;border:4px solid var(--panel);border-radius:23px}.profile-name{font:700 23px 'Space Grotesk';margin-top:8px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:20;box-shadow:var(--shadow)}@media(max-width:1000px){.layout{grid-template-columns:190px minmax(0,1fr)}.right{display:none}}@media(max-width:680px){.top{padding:12px 14px;gap:10px}.logo{font-size:21px}.search{max-width:none}.top .theme-label{display:none}.layout{display:block;padding:14px 12px 85px}.side{display:none}.mobile-nav{position:fixed;bottom:0;left:0;right:0;z-index:8;display:flex;justify-content:space-around;background:var(--panel);border-top:1px solid var(--line);padding:8px 4px max(8px,env(safe-area-inset-bottom))}.mobile-nav .nav{flex-direction:column;gap:3px;padding:6px;font-size:10px;margin:0}.mobile-nav .nav span{font-size:19px}.top .btn{padding:10px}.auth-wrap{margin:5vh auto}.card{border-radius:17px;padding:14px}}
</style>
</head>
<body><div id="root"></div><div id="toast" class="toast hidden"></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL='https://kgywdvgprqrxpjxybltt.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_7XTBalecZYXPqnKQXHLb_g_LwGsX8Zi';
const supabase=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const root=document.querySelector('#root');let session=null,profile=null,posts=[],page='Discover',theme=localStorage.getItem('motimori-theme')||'dark',query='',busy=false;
document.documentElement.dataset.theme=theme;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=s=>(s||'M').trim().slice(0,1).toUpperCase();
function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2600)}
function navItem(n,icon){return '<div class="nav '+(page===n?'active':'')+'" data-page="'+n+'"><span>'+icon+'</span> '+n+'</div>'}
function shell(content){root.innerHTML='<div class="app"><header class="top"><div class="logo">moti<span>mori</span><div class="small muted" style="letter-spacing:0;font-weight:400">A little world, entirely yours.</div></div><div class="search"><input class="field" id="search" placeholder="Search people and posts..." value="'+esc(query)+'"></div><button class="btn ghost" id="theme" title="Toggle theme">◐ <span class="theme-label">'+(theme==='dark'?'Dark':'Light')+'</span></button><button class="btn primary" id="logout">↗</button></header><div class="layout"><aside class="side">'+navItem('Discover','✦')+navItem('Communities','◉')+navItem('Messages','✉')+navItem('Friends','♡')+navItem('Profile','☺')+navItem('Settings','⚙')+'<div class="status">Your little corner of the internet.</div></aside><main>'+content+'</main><aside class="right"><div class="feature"><div class="eyebrow">Your little world</div><h2 style="font:700 23px Space Grotesk;margin:10px 0">Be yourself.<br>Find your people.</h2><p>Share moments, discover communities, and make the internet feel a little closer.</p></div><section class="card"><h3 class="right-title">Your space, your rules</h3><p class="muted small">Choose your theme and profile privacy in Settings. Your watch and activity history can be kept private.</p><button class="btn ghost" data-goto="Settings">Privacy settings →</button></section><section class="card"><div class="eyebrow">Motimori note</div><p class="muted small">Be kind. Keep personal information private. Make this space yours.</p></section></aside></div><nav class="mobile-nav">'+navItem('Discover','✦')+navItem('Messages','✉')+navItem('Friends','♡')+navItem('Profile','☺')+navItem('Settings','⚙')+'</nav></div>';
document.querySelector('#theme').onclick=()=>{theme=theme==='dark'?'light':'dark';localStorage.setItem('motimori-theme',theme);document.documentElement.dataset.theme=theme;render()};
document.querySelector('#logout').onclick=async()=>{if(session){await supabase.auth.signOut();session=null;profile=null;renderAuth()}else renderAuth()};
document.querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>{page=el.dataset.page;render()});document.querySelectorAll('[data-goto]').forEach(el=>el.onclick=()=>{page=el.dataset.goto;render()});
const search=document.querySelector('#search');search?.addEventListener('input',e=>{query=e.target.value;if(page==='Discover')renderFeedOnly()});}
function renderAuth(){root.innerHTML='<div class="auth-wrap"><div class="auth-logo">moti<span>mori</span></div><div class="auth-sub">A little world, entirely yours.</div><div class="card auth-card"><div class="eyebrow">Welcome to your world</div><h2 id="auth-title" style="font:700 25px Space Grotesk;margin:8px 0">Come on in.</h2><p class="muted small">Sign in or create your Motimori account.</p><form id="auth-form"><label>Email address</label><input class="field" id="email" type="email" autocomplete="email" required placeholder="you@example.com"><label>Password</label><input class="field" id="password" type="password" minlength="8" autocomplete="current-password" required placeholder="At least 8 characters"><label id="name-label" class="hidden">Display name</label><input class="field hidden" id="display-name" maxlength="40" placeholder="What should we call you?"><button class="btn primary" id="auth-submit" style="width:100%;margin-top:20px">Sign in</button></form><button class="btn ghost" id="switch-auth" style="width:100%;margin-top:10px">New here? Create an account</button><p class="muted small" style="line-height:1.5">By joining, use a unique password and keep your account details private.</p></div></div>';
let signup=false;const form=document.querySelector('#auth-form'),name=document.querySelector('#display-name'),label=document.querySelector('#name-label'),submit=document.querySelector('#auth-submit'),title=document.querySelector('#auth-title'),sw=document.querySelector('#switch-auth');
sw.onclick=()=>{signup=!signup;name.classList.toggle('hidden',!signup);label.classList.toggle('hidden',!signup);submit.textContent=signup?'Create account':'Sign in';title.textContent=signup?'Make it yours.':'Come on in.';sw.textContent=signup?'Already have an account? Sign in':'New here? Create an account'};
form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{const email=document.querySelector('#email').value.trim(),password=document.querySelector('#password').value;let result;if(signup)result=await supabase.auth.signUp({email,password,options:{data:{display_name:name.value.trim()||email.split('@')[0]}}});else result=await supabase.auth.signInWithPassword({email,password});if(result.error)throw result.error;if(signup&&!result.data.session){toast('Check your email to confirm your account.');return}session=result.data.session;await loadProfile();await loadPosts();render()}catch(err){toast(err.message||'Could not sign in')}finally{submit.disabled=false}};
}
async function loadProfile(){if(!session)return;const {data}=await supabase.from('profiles').select('*').eq('id',session.user.id).maybeSingle();profile=data||{id:session.user.id,display_name:session.user.user_metadata?.display_name||session.user.email.split('@')[0],username:session.user.email.split('@')[0]}}
async function loadPosts(){const {data,error}=await supabase.from('posts').select('*, profiles(id,display_name,username,avatar_url)').order('created_at',{ascending:false}).limit(40);if(error){posts=[];return}posts=data||[]}
function timeAgo(v){if(!v)return 'just now';const m=Math.floor((Date.now()-new Date(v).getTime())/60000);return m<1?'just now':m<60?m+'m ago':m<1440?Math.floor(m/60)+'h ago':Math.floor(m/1440)+'d ago'}
function postCard(p){const who=p.profiles||{},mine=p.user_id===session.user.id;return '<article class="card" data-post="'+esc(p.id)+'"><div class="posthead"><div class="avatar">'+esc(initials(who.display_name||who.username||'M'))+'</div><div class="grow"><b>'+esc(who.display_name||who.username||'Motimori user')+'</b><div class="muted small">@'+esc(who.username||'member')+' · '+timeAgo(p.created_at)+'</div></div>'+(mine?'<button class="btn ghost" data-delete="'+esc(p.id)+'">···</button>':'')+'</div><div class="postbody">'+esc(p.content||'')+'</div><div class="postactions"><button class="btn" data-like="'+esc(p.id)+'">♡ Like</button><button class="btn" data-comment="'+esc(p.id)+'">◌ Reply</button><button class="btn" data-share="'+esc(p.id)+'">↗ Share</button></div></article>'}
function discover(){return '<section class="card"><div class="eyebrow">Your feed</div><h2 style="font:700 24px Space Grotesk;margin:6px 0">What’s happening?</h2><div class="postbox"><div class="avatar">'+esc(initials(profile?.display_name))+'</div><div style="flex:1"><textarea class="field" id="post-content" maxlength="3000" placeholder="Share a thought with your little world..."></textarea><div class="actions"><span class="muted small">Be kind to each other ✨</span><button class="btn primary" id="publish">Post moment ↗</button></div></div></div></section><div id="feed">'+(posts.length?posts.map(postCard).join(''):'<div class="card empty"><div class="emoji">🌱</div><h3>Your feed starts here</h3><p class="muted">Be the first to share a moment.</p></div>')+'</div>'}
function profilePage(){return '<section class="card"><div class="profile-cover"></div><div class="profile-info"><div class="avatar">'+esc(initials(profile?.display_name))+'</div><div class="profile-name">'+esc(profile?.display_name||'Motimori user')+'</div><div class="muted">@'+esc(profile?.username||'member')+'</div><p>'+esc(profile?.bio||'A little world, entirely yours.')+'</p><button class="btn primary" id="edit-profile">Edit profile</button></div></section><section class="card"><h3>Your moments</h3>'+(posts.filter(p=>p.user_id===session.user.id).map(postCard).join('')||'<p class="muted">Your posts will show up here.</p>')+'</section>'}
function settingsPage(){return '<section class="card"><div class="eyebrow">Make yourself at home</div><h2 style="font:700 24px Space Grotesk">Settings & privacy</h2><h3>Appearance</h3><button class="btn" id="theme-setting">Switch to '+(theme==='dark'?'light':'dark')+' mode</button><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Activity history</h3><p class="muted small">Control whether your activity history is visible on your profile.</p><label><input type="checkbox" id="history-private" '+(profile?.history_private!==false?'checked':'')+'> Keep my history private</label><div style="margin-top:18px"><button class="btn primary" id="save-settings">Save settings</button></div><p class="muted small">More profile visibility and messaging controls will be added as the app develops.</p></section>'}
function pageContent(){if(page==='Discover')return discover();if(page==='Profile')return profilePage();if(page==='Settings')return settingsPage();const descriptions={Communities:'Find people who love the same things you do.',Messages:'A private place for conversations with your friends.',Friends:'Your people, all in one place.'};return '<section class="card empty"><div class="emoji">'+({Communities:'🌸',Messages:'✉️',Friends:'🫶'}[page]||'✨')+'</div><h2 style="font:700 24px Space Grotesk">'+esc(page)+'</h2><p class="muted">'+esc(descriptions[page]||'Coming soon to your little world.')+'</p><span class="chip">Under development</span></section>'}
function render(){if(!session){renderAuth();return}shell(pageContent());wirePage()}
function renderFeedOnly(){const feed=document.querySelector('#feed');if(!feed)return;const q=query.toLowerCase();const filtered=posts.filter(p=>(p.content||'').toLowerCase().includes(q)||(p.profiles?.display_name||'').toLowerCase().includes(q)||(p.profiles?.username||'').toLowerCase().includes(q));feed.innerHTML=filtered.length?filtered.map(postCard).join(''):'<div class="card empty"><p class="muted">No matching moments found.</p></div>';wirePostActions()}
function wirePostActions(){document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this post?'))return;const {error}=await supabase.from('posts').delete().eq('id',b.dataset.delete).eq('user_id',session.user.id);if(error)toast(error.message);else{await loadPosts();render()}});document.querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>toast('Likes are coming in the next build.'));document.querySelectorAll('[data-comment]').forEach(b=>b.onclick=()=>toast('Replies are coming in the next build.'));document.querySelectorAll('[data-share]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(location.href+'#post-'+b.dataset.share);toast('Link copied')}catch{toast('Copy the page link to share')}})}
function wirePage(){wirePostActions();const pub=document.querySelector('#publish');if(pub)pub.onclick=async()=>{const area=document.querySelector('#post-content'),content=area.value.trim();if(!content)return toast('Write something first.');pub.disabled=true;const {error}=await supabase.from('posts').insert({user_id:session.user.id,content});if(error)toast(error.message);else{await loadPosts();render();toast('Your moment is live ✨')}pub.disabled=false};
document.querySelector('#edit-profile')?.addEventListener('click',async()=>{const display_name=prompt('Display name',profile?.display_name||'');if(display_name===null)return;const username=prompt('Username (letters, numbers, underscores)',profile?.username||'');if(username===null)return;const bio=prompt('Short bio',profile?.bio||'');if(bio===null)return;const {data,error}=await supabase.from('profiles').update({display_name:display_name.trim(),username:username.trim().toLowerCase().replace(/[^a-z0-9_]/g,''),bio:bio.trim()}).eq('id',session.user.id).select().single();if(error)toast(error.message);else{profile=data;render();toast('Profile updated')}});document.querySelector('#theme-setting')?.addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';localStorage.setItem('motimori-theme',theme);document.documentElement.dataset.theme=theme;render()});document.querySelector('#save-settings')?.addEventListener('click',async()=>{const history_private=document.querySelector('#history-private').checked;const {error}=await supabase.from('user_settings').upsert({user_id:session.user.id,history_private});if(error)toast(error.message);else{profile={...profile,history_private};toast('Settings saved')}})}
supabase.auth.onAuthStateChange(async(_event,s)=>{if(s&&!session){session=s;await loadProfile();await loadPosts();render()}else if(!s&&session){session=null;profile=null;posts=[];renderAuth()}});
const {data:{session:initial}}=await supabase.auth.getSession();if(initial){session=initial;await loadProfile();await loadPosts();render()}else renderAuth();
</script></body></html>
